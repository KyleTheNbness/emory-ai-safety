# ============================================================
#  "Who it's for" 四类人
# ============================================================

- who: You code, or study CS, math, or data science
  what: Go deep on how models are trained, tested, and taken apart. The fellowship is a starting point for research programs like MATS and SPAR.

- who: You study policy, economics, law, or philosophy
  what: Half of every session is governance. Learn how labs, governments, and treaties try to keep AI in check, and where they fall short.

- who: You're curious but new to all of this
  what: Good. We read together in the room, so there is no homework and nothing to catch up on. Bring questions.

- who: You want to build something
  what: Fellows who bring real energy are invited to join the organizing team and help shape what Redline becomes.
