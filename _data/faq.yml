# ============================================================
#  常见问题
# ============================================================

- q: Do I need to know machine learning?
  a: No. The readings explain what you need. If you can code a little, you will get more out of the technical weeks.

- q: How much time does it take?
  a: About two to three hours a week for six weeks, including the reading.

- q: When does it start?
  a: Applications open November 30 and close January 18. The fellowship starts in late January.

- q: Who runs this?
  a: Oxford College students. We are independent of any company.
