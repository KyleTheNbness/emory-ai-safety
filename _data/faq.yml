# ============================================================
#  常见问题
# ============================================================

- q: Do I need to know machine learning?
  a: No. We value passion and motivation over technical background. If you can code a little, you will get more out of the technical weeks.

- q: How do I become a member?
  a: Fill out our interest survey or come to one of our meetings. Every Oxford College student is welcome.

- q: How much time does it take?
  a: About two to three hours a week for six weeks, including the reading.

- q: When does it start?
  a: Applications open November 30 and close January 18. The fellowship starts in late January.

- q: Who runs this?
  a: "Three Oxford College students: Kyle Yu, Daniel Hu, and William Ye. We are independent of any company."
