# ============================================================
#  常见问题
# ============================================================

- q: Do I need to know machine learning?
  a: No. Half of each session is governance, and we read together in the room. We value passion and motivation over technical background.

- q: How do I become a member?
  a: Fill out our interest survey or come to one of our meetings. Every Oxford College student is welcome.

- q: How much time does it take?
  a: "One session a week for six weeks, about 2–3 hours each. Reading happens during the session, so there is no homework."

- q: When does it start?
  a: Applications are open now and close January 18. The fellowship starts the week of February 1.

- q: Who runs this?
  a: "Three Oxford College students: Kyle Yu, Daniel Hu, and William Ye. We are independent of any company."
