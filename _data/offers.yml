# ============================================================
#  "What we offer" 四项。想加一项就复制一整块
# ============================================================

- title: Funded, mentored research
  body: Every fellowship graduate can join a research project guided by a mentor, and we cover the compute. Replicate a paper, build an eval, or dig into a model's internals.

- title: Speaker events
  body: Talks and Q&As with people working on AI safety at labs, universities, and research orgs.

- title: Career advice
  body: Guidance on research programs like MATS and SPAR, policy and think-tank paths, internships, and grad school.

- title: A wider network
  body: We connect with AI safety groups at Emory and beyond, so you meet the people already doing this work.
