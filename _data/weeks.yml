# ============================================================
#  Spring Fellowship 每周内容：技术主题 + 治理主题 + 讨论题
#  阅读材料来自 BlueDot 的 Technical AI Safety 和 Frontier AI Governance 课程
#  句子里有冒号的，整句用英文双引号包起来
# ============================================================

- week: Week 1
  tech: The technical challenge
  tech_note: Why it's hard to make powerful AI do what we intend.
  gov: What drives AI progress?
  gov_note: Algorithms, data, and compute, the "AI triad" most policy tools target.
  discuss: If you could regulate only one part of the triad, which would you pick?

- week: Week 2
  tech: Training safer models
  tech_note: RLHF, scalable oversight, and where they fall short.
  gov: Can companies govern themselves?
  gov_note: Lab commitments like Anthropic's Responsible Scaling Policy and OpenAI's Preparedness Framework.
  discuss: When does self-governance work, and when doesn't it?

- week: Week 3
  tech: Evals and red-teaming
  tech_note: Testing models for dangerous capabilities before release.
  gov: Turning evals into rules
  gov_note: How test results can trigger policy action.
  discuss: If a model passes a dangerous-capability eval, is it safe? Who sets the bar?

- week: Week 4
  tech: Interpretability
  tech_note: Circuits inside networks and monitoring chains of thought.
  gov: Transparency and accountability
  gov_note: What laws like the EU AI Act require developers to disclose.
  discuss: If developers can't fully explain a model, how can regulators hold anyone accountable?

- week: Week 5
  tech: Minimising harm
  tech_note: Building defences for when things go wrong.
  gov: National and international governance
  gov_note: Export controls on AI chips, and summits like Bletchley in 2023.
  discuss: Does AI governance need US–China cooperation? Is that realistic?

- week: Week 6
  tech: The research path
  tech_note: Our mentor-guided research projects, MATS, SPAR, and replicating papers.
  gov: The policy path
  gov_note: Policy research, think tanks, and government roles.
  discuss: Which path pulls you, and what's one concrete next step?
